<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f1e8"><title>Agenda de Conteúdo</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"></head><body>
<svg class="symbols" aria-hidden="true"><defs>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="4"/><path d="M7.5 3v4m9-4v4M4 10h16m-12 4h2m4 0h2m-8 3h2"/></symbol>
<symbol id="i-year" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
<symbol id="i-week" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m6-16v16M3 9h18"/></symbol>
<symbol id="i-day" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8m-8 4h5"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol><symbol id="i-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></symbol><symbol id="i-story" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="4"/><path d="M10 5h4m-4 14h4"/></symbol><symbol id="i-reels" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18M7 3l4 6m3-6 4 6m-8 3v6l5-3z"/></symbol><symbol id="i-carousel" viewBox="0 0 24 24"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M8 21h10a3 3 0 0 0 3-3V8"/></symbol>
<symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M8 12h8m-8 4h6"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 8V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v7a3 3 0 0 0 3 3h2"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l5-1L20 8a2 2 0 0 0 0-3l-1-1a2 2 0 0 0-3 0L5 15z"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></symbol>
</defs></svg>
<main class="app"><header class="brand"><button class="brand-mark" id="home-calendar" type="button" aria-label="Voltar ao calendário do mês atual"><svg><use href="#i-calendar"/></svg></button><div><h1>Agenda de Conteúdo</h1><p>Calendário De Postagens no Instagram</p></div></header>
<nav class="quick-menu" aria-label="Menu principal"><button class="menu-calendar" id="open-calendar" type="button"><svg><use href="#i-calendar"/></svg><span>Calendário</span></button><button class="today-button" id="go-today" type="button" aria-label="Voltar para hoje"><span id="current-date"></span><strong id="current-time"></strong></button><button class="new-button" id="new-record" type="button"><svg><use href="#i-plus"/></svg><span>Novo</span></button></nav>
<section class="calendar-shell" aria-label="Calendário de postagens"><nav class="view-toolbar" aria-label="Visualização e navegação"><div class="view-navigator" data-active-view="month"><button class="nav-arrow" type="button" data-shift="month" data-direction="-1" aria-label="Mês anterior"><svg><use href="#i-left"/></svg></button><button class="view-label" type="button" data-view-control="month"><svg><use href="#i-calendar"/></svg><span id="month-label">Mês</span></button><button class="nav-arrow" type="button" data-shift="month" data-direction="1" aria-label="Próximo mês"><svg><use href="#i-right"/></svg></button></div><div class="view-navigator" data-active-view="week"><button class="nav-arrow" type="button" data-shift="week" data-direction="-1" aria-label="Semana anterior"><svg><use href="#i-left"/></svg></button><button class="view-label" type="button" data-view-control="week"><svg><use href="#i-week"/></svg><span>Semana</span></button><button class="nav-arrow" type="button" data-shift="week" data-direction="1" aria-label="Próxima semana"><svg><use href="#i-right"/></svg></button></div><div class="view-navigator" data-active-view="day"><button class="nav-arrow" type="button" data-shift="day" data-direction="-1" aria-label="Dia anterior"><svg><use href="#i-left"/></svg></button><button class="view-label" type="button" data-view-control="day"><svg><use href="#i-day"/></svg><span>Dia</span></button><button class="nav-arrow" type="button" data-shift="day" data-direction="1" aria-label="Próximo dia"><svg><use href="#i-right"/></svg></button></div></nav><div class="toolbar legacy-toolbar" aria-hidden="true"><div class="period"><div class="arrows"><button class="icon-btn" id="previous" tabindex="-1"><svg><use href="#i-left"/></svg></button><button class="icon-btn" id="next" tabindex="-1"><svg><use href="#i-right"/></svg></button></div><div><h2 class="period-title" id="period-title"></h2><div class="period-year" id="period-year"></div></div></div><nav class="view-switch"><button class="view-btn" data-view="year" tabindex="-1"><svg><use href="#i-year"/></svg>Ano</button><button class="view-btn" data-view="month" tabindex="-1"><svg><use href="#i-calendar"/></svg>Mês</button><button class="view-btn" data-view="week" tabindex="-1"><svg><use href="#i-week"/></svg>Semana</button><button class="view-btn" data-view="day" tabindex="-1"><svg><use href="#i-day"/></svg>Dia</button></nav></div><p class="error-banner" id="storage-error" role="alert" hidden></p><div class="view-heading" id="view-heading" aria-live="polite"></div><div id="calendar"></div><div class="calendar-foot" aria-hidden="true"><svg><use href="#i-calendar"/></svg><span id="calendar-hint"></span></div></section></main>
<dialog id="record-dialog" aria-labelledby="dialog-title"><div class="dialog-inner"><header class="dialog-head"><div><h2 id="dialog-title">Nova postagem</h2><p id="dialog-subtitle"></p></div><button class="icon-btn" id="close-dialog" autofocus aria-label="Fechar"><svg><use href="#i-close"/></svg></button></header><div class="dialog-scroll" id="dialog-body"></div><p class="dialog-message" id="dialog-message" role="status" hidden></p><footer class="dialog-actions" id="dialog-actions"></footer></div></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><div class="dialog-inner"><div class="dialog-scroll confirm-content"><h2 id="confirm-title">Tem certeza que deseja excluir?</h2><p>Esta ação não poderá ser desfeita.</p></div><footer class="dialog-actions"><button class="secondary" id="cancel-delete" autofocus>Cancelar</button><button class="primary" id="confirm-delete"><svg aria-hidden="true"><use href="#i-trash"/></svg>Excluir</button></footer></div></dialog><div class="toast" id="toast" role="status" hidden></div><script src="app.js"></script><script src="enhancements.js"></script></body></html>
